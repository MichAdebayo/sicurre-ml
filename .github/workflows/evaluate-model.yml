name: Evaluate model candidate

on:
  workflow_call:
    inputs:
      candidate_mlflow_run_id: {required: true, type: string}
      candidate_mlflow_model_version: {required: true, type: string}
      candidate_hf_revision: {required: true, type: string}
      incumbent_hf_revision: {required: false, type: string, default: production}
      semantic_version: {required: true, type: string}
      service_source_revision: {required: true, type: string}
      training_github_run_id: {required: true, type: string}
      training_dataset_version: {required: true, type: string}
    outputs:
      outcome:
        description: "passed, failed, or inconclusive"
        value: ${{ jobs.evaluate.outputs.outcome }}
      evaluation_run_id:
        description: "Authoritative MLflow golden-set evaluation run ID"
        value: ${{ jobs.evaluate.outputs.evaluation_run_id }}
      candidate_mlflow_run_id:
        value: ${{ jobs.evaluate.outputs.candidate_mlflow_run_id }}
      candidate_mlflow_model_version:
        value: ${{ jobs.evaluate.outputs.candidate_mlflow_model_version }}
      candidate_hf_revision:
        value: ${{ jobs.evaluate.outputs.candidate_hf_revision }}
      semantic_version:
        value: ${{ jobs.evaluate.outputs.semantic_version }}
    secrets:
      R2_EVALUATION_ACCESS_KEY_ID: {required: true}
      R2_EVALUATION_SECRET_ACCESS_KEY: {required: true}
      R2_EVALUATION_ENDPOINT: {required: true}
      R2_EVALUATION_BUCKET_NAME: {required: true}
      SICURRE_CALLBACK_BASE_URL: {required: true}
      SICURRE_INTERNAL_API_KEY: {required: true}
      DATABRICKS_HOST: {required: true}
      DATABRICKS_TOKEN: {required: true}
      DATABRICKS_EMAIL: {required: true}
      MLFLOW_EXPERIMENT_NAME: {required: true}
      HF_TOKEN: {required: true}
      HF_USERNAME: {required: true}
      REPO_NAME: {required: true}
  workflow_dispatch:
    inputs:
      candidate_mlflow_run_id:
        description: "Candidate MLflow training run ID"
        required: true
      candidate_mlflow_model_version:
        description: "Candidate registered MLflow model version"
        required: true
      candidate_hf_revision:
        description: "Immutable candidate Hugging Face commit SHA"
        required: true
      incumbent_hf_revision:
        description: "Immutable incumbent SHA or production tag"
        required: false
        default: "production"
      semantic_version:
        description: "Candidate semantic version"
        required: true
      service_source_revision:
        description: "Training source commit SHA"
        required: true
      training_github_run_id:
        description: "Training GitHub Actions run ID"
        required: true
      training_dataset_version:
        description: "Frozen Sicurre training dataset version tag"
        required: true

permissions:
  contents: read

concurrency:
  group: model-candidate-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      outcome: ${{ steps.evaluation.outputs.outcome }}
      evaluation_run_id: ${{ steps.evaluation.outputs.evaluation_run_id }}
      candidate_mlflow_run_id: ${{ steps.evaluation.outputs.candidate_mlflow_run_id }}
      candidate_mlflow_model_version: ${{ steps.evaluation.outputs.candidate_mlflow_model_version }}
      candidate_hf_revision: ${{ steps.evaluation.outputs.candidate_hf_revision }}
      semantic_version: ${{ steps.evaluation.outputs.semantic_version }}
    env:
      R2_EVALUATION_ACCESS_KEY_ID: ${{ secrets.R2_EVALUATION_ACCESS_KEY_ID }}
      R2_EVALUATION_SECRET_ACCESS_KEY: ${{ secrets.R2_EVALUATION_SECRET_ACCESS_KEY }}
      R2_EVALUATION_ENDPOINT: ${{ secrets.R2_EVALUATION_ENDPOINT }}
      R2_EVALUATION_BUCKET_NAME: ${{ secrets.R2_EVALUATION_BUCKET_NAME }}
      SICURRE_CALLBACK_BASE_URL: ${{ secrets.SICURRE_CALLBACK_BASE_URL }}
      SICURRE_INTERNAL_API_KEY: ${{ secrets.SICURRE_INTERNAL_API_KEY }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_EMAIL: ${{ secrets.DATABRICKS_EMAIL }}
      MLFLOW_EXPERIMENT_NAME: ${{ secrets.MLFLOW_EXPERIMENT_NAME }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CANDIDATE_MLFLOW_RUN_ID: ${{ inputs.candidate_mlflow_run_id }}
      CANDIDATE_MLFLOW_MODEL_VERSION: ${{ inputs.candidate_mlflow_model_version }}
      CANDIDATE_HF_REVISION: ${{ inputs.candidate_hf_revision }}
      INCUMBENT_HF_REVISION: ${{ inputs.incumbent_hf_revision }}
      # Both halves come straight from secrets. A job output containing a
      # secret value is scrubbed to empty in transit, and splitting the
      # repository into owner and name does not help: REPO_NAME is itself a
      # registered secret, so the name alone was emptied too and this
      # resolved to "***/". Never route either half through an output.
      HF_REPOSITORY: ${{ secrets.HF_USERNAME }}/${{ secrets.REPO_NAME }}
      SEMANTIC_VERSION: ${{ inputs.semantic_version }}
      SERVICE_SOURCE_REVISION: ${{ inputs.service_source_revision }}
      TRAINING_GITHUB_RUN_ID: ${{ inputs.training_github_run_id }}
      TRAINING_DATASET_VERSION: ${{ inputs.training_dataset_version }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install evaluation dependencies
        run: uv sync --frozen --group ml --group mlops --group inference

      - name: Validate immutable inputs and required configuration
        run: |
          set -euo pipefail
          for value in \
            "$R2_EVALUATION_ACCESS_KEY_ID" \
            "$R2_EVALUATION_SECRET_ACCESS_KEY" \
            "$R2_EVALUATION_ENDPOINT" \
            "$R2_EVALUATION_BUCKET_NAME" \
            "$SICURRE_CALLBACK_BASE_URL" \
            "$SICURRE_INTERNAL_API_KEY"; do
            test -n "$value" || { echo "A required evaluation configuration is missing." >&2; exit 1; }
          done
          printf '%s' "$CANDIDATE_MLFLOW_RUN_ID" | grep -Eq '^[a-f0-9]{32}$'
          printf '%s' "$CANDIDATE_MLFLOW_MODEL_VERSION" | grep -Eq '^[1-9][0-9]*$'
          printf '%s' "$CANDIDATE_HF_REVISION" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s' "$INCUMBENT_HF_REVISION" | grep -Eq '^(production|[a-f0-9]{40})$'
          printf '%s' "$HF_REPOSITORY" | grep -Eq '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$'
          printf '%s' "$SEMANTIC_VERSION" |
            grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$'
          printf '%s' "$SERVICE_SOURCE_REVISION" | grep -Eq '^[a-f0-9]{40}$'
          printf '%s' "$TRAINING_GITHUB_RUN_ID" | grep -Eq '^[0-9]+$'
          printf '%s' "$TRAINING_DATASET_VERSION" | grep -Eq '^[A-Za-z0-9._:+/-]+$'

      - name: Evaluate candidate and persist provenance
        id: evaluation
        run: |
          PYTHONPATH=. uv run python .github/scripts/evaluate_candidate.py \
            --candidate-mlflow-run-id "$CANDIDATE_MLFLOW_RUN_ID" \
            --candidate-mlflow-model-version "$CANDIDATE_MLFLOW_MODEL_VERSION" \
            --candidate-hf-revision "$CANDIDATE_HF_REVISION" \
            --incumbent-hf-revision "$INCUMBENT_HF_REVISION" \
            --hf-repository "$HF_REPOSITORY" \
            --semantic-version "$SEMANTIC_VERSION" \
            --service-source-revision "$SERVICE_SOURCE_REVISION" \
            --training-github-run-id "$TRAINING_GITHUB_RUN_ID" \
            --training-dataset-version "$TRAINING_DATASET_VERSION"
